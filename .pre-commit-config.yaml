# NOTE: It's important that you run pre-commit install --hook-type commit-msg,
# even if you've already used pre-commit install before. pre-commit install
# does not install commit-msg hooks by default!

repos:
  - repo: https://github.com/FeryET/pre-commit-rust
    rev: v1.2.1
    hooks:
      - id: fmt
      - id: clippy
      - id: test
  - repo: https://github.com/Artalus/pre-commit-clippy-fix
    rev: v0.1
    hooks:
      - id: clippy-fix
  # common checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: forbid-submodules
  # code spellcheck
  - repo: https://github.com/crate-ci/typos
    rev: v1.47.0
    hooks:
      - id: typos-src # compile with cargo
  # lints git commit messages
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1 # Fill in a tag / sha here (e.g. v0.19.1)
    hooks:
      - id: gitlint
        args: [--ignore, body-is-missing, --staged, --msg-filename]
